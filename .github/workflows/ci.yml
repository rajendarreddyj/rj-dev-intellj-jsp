name: IntelliJ Plugin CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-latest:
    runs-on: ubuntu-latest
    outputs:
      test-matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - id: release
        name: Resolve latest stable IntelliJ IDEA
        shell: bash
        run: |
          release_json="$(curl --fail --silent --show-error --location 'https://data.services.jetbrains.com/products/releases?code=IIU&latest=true&type=release')"
          latest="$(jq --exit-status --raw-output '.IIU[0].version | select(type == "string" and length > 0)' <<< "$release_json")"
          if [[ ! "$latest" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid latest IntelliJ IDEA stable version: $latest" >&2
            exit 1
          fi
          matrix="$(
            jq --compact-output --null-input --arg latest "$latest" '
              [
                {platformVersion:"2024.2.6",platformType:"IntellijIdeaCommunity",javaVersion:"21",useInstaller:"true"},
                {platformVersion:"2025.3",platformType:"IntellijIdeaCommunity",javaVersion:"21",useInstaller:"false"}
              ] + (if $latest == "2024.2.6" or $latest == "2025.3" then [] else
                [{platformVersion:$latest,platformType:"IntellijIdeaCommunity",javaVersion:"25",useInstaller:"false"}] end)
            '
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-latest.outputs.test-matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.javaVersion }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests on IntelliJ IDEA ${{ matrix.platformVersion }}
        run: ./gradlew test -PplatformType=${{ matrix.platformType }} -PplatformVersion=${{ matrix.platformVersion }} -PjavaToolchain=${{ matrix.javaVersion }} -PuseInstaller=${{ matrix.useInstaller }}

  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify plugin compatibility and build distribution
        run: ./gradlew verifyPlugin buildPlugin
